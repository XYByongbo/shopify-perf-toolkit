name: Toolkit regression

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Toolkit offline regression
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Check architecture boundaries
        run: npm run test:boundaries
      - name: Run offline Node tests
        run: npm run test:offline
      - name: Run Python regression tests
        run: npm run test:lighthouse

  browser:
    name: Toolkit browser regression
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run browser tests with the runner's Chrome
        run: npm run test:browser

  official:
    name: Toolkit official Theme Check regression
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the pinned Shopify CLI
        run: npm install --global @shopify/cli@5.0.1
      - name: Run official Theme Check tests
        run: |
          shopify_cli="$(npm prefix --global)/bin/shopify"
          test -x "$shopify_cli"
          PERF_KIT_SHOPIFY_CLI="$shopify_cli" npm run test:official

  gate:
    name: Toolkit regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [offline, browser, official]
    if: ${{ always() }}
    steps:
      - name: Require all regression jobs to succeed
        env:
          OFFLINE_RESULT: ${{ needs.offline.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          OFFICIAL_RESULT: ${{ needs.official.result }}
        run: |
          printf 'Offline: %s\nBrowser: %s\nOfficial: %s\n' "$OFFLINE_RESULT" "$BROWSER_RESULT" "$OFFICIAL_RESULT"
          test "$OFFLINE_RESULT" = success && test "$BROWSER_RESULT" = success && test "$OFFICIAL_RESULT" = success
